name: Deploy $SB site to Vercel

# Vercel is unreachable from the Claude session that authors this repo — the
# egress gateway answers 403 to CONNECT api.vercel.com — but a GitHub runner
# has open outbound access, so the deploy happens here instead.

on:
  push:
    branches: [main]
    paths:
      - "website1/**"
      - ".github/workflows/vercel.yml"
  workflow_dispatch:

concurrency:
  group: vercel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website1/package-lock.json

      - name: Fail early if the token is missing
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. Add it at" \
                 "https://github.com/aibardefi/aibardefi/settings/secrets/actions/new"
            exit 1
          fi

      - run: npm ci
        working-directory: website1

      # No base path: this one is served from the root of a Vercel domain,
      # unlike the GitHub Pages copy which lives under /aibardefi/website1.
      - run: npm run build
        working-directory: website1
        env:
          NEXT_PUBLIC_SITE_URL: https://sb-kapibara.vercel.app

      # Two things are load-bearing about this shape:
      #
      #  - the directory is named after the project, which is how the CLI links
      #    to the existing sb-kapibara rather than creating a second one;
      #  - the export sits in a website1/ subfolder, because the project's Root
      #    Directory setting is "website1" and Vercel resolves that path inside
      #    whatever is uploaded. Uploading the built files directly failed with
      #    "the provided path .../sb-kapibara/website1 does not exist".
      #
      # There is no package.json in the uploaded tree, so Vercel detects no
      # framework and serves the export as static files instead of rebuilding
      # it — the build already happened in the step above.
      - name: Stage the export where the project expects it
        run: |
          set -euo pipefail
          test -f website1/out/index.html
          rm -rf sb-kapibara
          mkdir -p sb-kapibara/website1
          cp -r website1/out/. sb-kapibara/website1/
          test -f sb-kapibara/website1/index.html

      - name: Deploy to production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest deploy sb-kapibara \
            --prod --yes --token "$VERCEL_TOKEN" | tee vercel-url.txt
          echo "url=$(tail -n 1 vercel-url.txt)" >> "$GITHUB_OUTPUT"

      - name: Report the live URL
        run: |
          echo "### $SB site deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "LIVE URL: ${{ steps.deploy.outputs.url }}"
